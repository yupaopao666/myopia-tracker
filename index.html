<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myopia Tracker</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="./app.js?v=debug1"></script>
  <main class="app">
    <header class="topbar">
      <h1>眼生物测量记录</h1>
      <button id="installButton" type="button" hidden>↓ 安装</button>
    </header>

    <section class="panel">
      <label>
        当前用户
        <select id="profileSelect"></select>
      </label>

      <label>
        新用户
        <input id="profileNameInput" type="text" placeholder="输入名字" />
      </label>

      <button id="createProfileButton" type="button">创建</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="upload" type="button">上传</button>
      <button class="tab" data-tab="trends" type="button">趋势</button>
      <button class="tab" data-tab="records" type="button">记录</button>
    </nav>

    <section id="uploadTab" class="tab-panel active">
      <div class="panel">
        <label>
          检查时间
          <input id="capturedAtInput" type="datetime-local" />
        </label>
      </div>

      <div class="json-import-panel">
  <label for="jsonInput">
    粘贴 JSON
  </label>

  <textarea
    id="jsonInput"
    rows="10"
    placeholder='[
  {
    "measurement_time": "2026-06-03 11:46:08",
    "right_eye": {
      "AL": 24.55
    },
    "left_eye": {
      "AL": 24.55
    }
  }
]'
  ></textarea>

  <div class="json-divider">
    或
  </div>

  <input
    id="jsonFileInput"
    class="file-input"
    type="file"
    accept=".json,application/json"
  />

  <button
    id="chooseJsonButton"
    class="secondary-button"
    type="button"
  >
    选择 JSON 文件
  </button>

  <span id="jsonFileName"></span>
</div>

<div class="actions">
  <button id="importJsonButton" type="button">
    导入 JSON
  </button>

  <button id="clearUploadsButton" type="button">
    清空
  </button>
</div>

<p id="importStatus">
  粘贴 JSON 或选择 JSON 文件
</p>

      <div id="uploadList"></div>

      <section class="average-box">
  <h2>当次平均值</h2>
  <p id="averageSummary">请先确认每条 record，然后点击“计算平均值”</p>

  <div class="actions">
    <button id="calculateButton" type="button" disabled>计算平均值</button>
    <button id="saveRecordButton" type="button" disabled>保存数据</button>
  </div>
</section>
    </section>

    <section id="trendsTab" class="tab-panel">
      <div class="metric-tabs">
  <button class="metric-tab active" data-chart-metric="axial" type="button">AL 眼轴</button>
  <button class="metric-tab" data-chart-metric="cornealThickness" type="button">CT</button>
  <button class="metric-tab" data-chart-metric="anteriorChamberDepth" type="button">AD</button>
  <button class="metric-tab" data-chart-metric="lensThickness" type="button">LT</button>
  <button class="metric-tab" data-chart-metric="vitreousChamberLength" type="button">VT</button>
  <button class="metric-tab" data-chart-metric="alCr" type="button">AL/CR</button>
  <button class="metric-tab" data-chart-metric="k1" type="button">K1</button>
  <button class="metric-tab" data-chart-metric="k2" type="button">K2</button>
  <button class="metric-tab" data-chart-metric="kappa" type="button">Kappa</button>
</div>

<div class="trend-chart-container">
  <canvas id="trendCanvas"></canvas>
</div>
      <p id="emptyTrendMessage">当前用户还没有记录</p>
    </section>

    <section id="recordsTab" class="tab-panel">
      <div class="actions">
        <button id="exportButton" type="button">导出 JSON</button>
        <label class="import-button">
          导入 JSON
          <input id="importInput" type="file" accept="application/json" />
        </label>
        <button id="deleteProfileButton" type="button">删除当前用户</button>
      </div>

      <div id="recordsList"></div>
    </section>
  </main>

  <template id="readingTemplate">
    <article class="reading-card">
      <div class="reading-header">
        <h3></h3>
        <span class="status-pill">待确认</span>
      </div>

      <img class="preview" alt="uploaded preview" />

      <div class="metric-grid"></div>

      <details>
        <summary>识别文本</summary>
        <pre></pre>
      </details>
    </article>
  </template>
</body>
</html>
